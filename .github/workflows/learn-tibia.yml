name: Learn Tibia identifiers

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tibia-model-publication
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install fitting dependency
        run: python3 -m pip install numpy==2.3.5
      - name: Restore cumulative history, including labels from failed gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/tibia_learning.py restore
      - name: Capture Tibia title and tags
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python3 tools/tibia_learning.py capture
      - name: Label previously unseen metadata
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_LABEL_MODEL: ${{ vars.LLM_LABEL_MODEL }}
        run: python3 tools/tibia_learning.py label
      - name: Retain cumulative captures and labels before gating
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tibia-learning-history
          path: |
            local/learning/history.json
            local/learning/captures/
          if-no-files-found: error
          retention-days: 90
      - name: Fit and gate newest inputs and unseen server names
        run: python3 tools/tibia_learning.py prepare
      - name: Run full acceptance and repository checks
        run: python3 tools/check_project.py
      - name: Verify browser inference on learned features
        run: python3 -m unittest discover -s tests/python -p test_tibia_js_parity.py
      - name: Stage verified publication
        run: |
          mkdir -p local/publication/research/twitch/model local/publication/filters/sources/twitch local/publication/extension/src
          cp research/twitch/model/private-span-model.json local/publication/research/twitch/model/
          cp filters/sources/twitch/tibia-evidence.json local/publication/filters/sources/twitch/
          cp extension/src/tibia-evidence.js local/publication/extension/src/
          git rev-parse HEAD > local/publication/base-sha
      - name: Upload verified publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tibia-verified-publication
          path: local/publication/
          if-no-files-found: error
          retention-days: 14
      - name: Retain aggregate gate diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tibia-learning-gate
          path: local/learning/gate.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    needs: learn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Download this run's verified model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -n tibia-verified-publication -D local/publication
      - name: Publish verified model with concurrent-main guard
        env:
          MODEL_PUBLISH_TOKEN: ${{ secrets.MODEL_PUBLISH_TOKEN }}
        run: python3 tools/publish_tibia_model.py
