name: Validate project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check extensions/twitch-clean/extension/page.js
      - run: node --check extensions/twitch-clean/extension/nags.js
      - run: for f in tibia-evidence tibia-classify tibia-filter ocr-background; do node --check extensions/twitch-clean/extension/$f.js; done
      - run: node --check scripts/twitch/twitch-stopthemadness.js
      - run: node tests/twitch-startup.cjs
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/build_filters.py
      - run: git diff --exit-code -- filters/
