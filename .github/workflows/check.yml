name: Validate project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }} / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run repository checks
        run: python3 tools/check_project.py
      - name: Build Chrome development package
        run: python3 tools/package_chrome_extension.py
      - name: Confirm generated sources are committed
        run: git diff --exit-code -- filters/ extension/src/
      - name: Upload Chrome development package
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tibia-anti-ad-chrome-${{ github.sha }}
          path: dist/tibia-anti-ad-chrome.zip*
          if-no-files-found: error
          retention-days: 14

  safari:
    name: Safari macOS build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and verify universal Safari development app
        run: python3 tools/build_safari_extension.py
      - name: Package Safari downloads
        run: python3 tools/package_safari_extension.py
      - name: Upload Safari development packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tibia-anti-ad-safari-${{ github.sha }}
          path: dist/tibia-anti-ad-safari-*.zip*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified extension downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, safari]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: extension-release-publication
      cancel-in-progress: false
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's verified Chrome and Safari packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n "tibia-anti-ad-chrome-$GITHUB_SHA" -D dist/release
          gh run download "$GITHUB_RUN_ID" -n "tibia-anti-ad-safari-$GITHUB_SHA" -D dist/release
      - name: Verify packages and publish a missing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_extension.py
